# Deployment compose for the SSO (per-user login) importer on the Dataverse host.
# Serves HTTPS directly on :8443 with a self-signed cert (certs/), joins the
# existing Dataverse docker network, and reads OIDC + server config from .env.
#
#   docker compose -f docker-compose.deploy.yml up -d --build
#
services:
  importer:
    build: .
    image: excel-dataverse-importer:sso
    container_name: excel-dataverse-importer
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - dataverse_dataverse
    ports:
      - "8443:8443"          # public HTTPS entry point for the web UI + API
    volumes:
      - ./certs:/certs:ro     # self-signed TLS material (key.pem / cert.pem)
    command:
      - uvicorn
      - metaforge_dataverse.app:app
      - --host=0.0.0.0
      - --port=8443
      - --ssl-keyfile=/certs/key.pem
      - --ssl-certfile=/certs/cert.pem
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request,sys; ctx=ssl._create_unverified_context(); sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/health',timeout=3,context=ctx).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dataverse_dataverse:
    external: true
